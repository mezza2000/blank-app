<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex,nofollow">
  <title>BinarioForse | Stiamo arrivando… o forse no</title>
  <meta name="description" content="Stiamo arrivando... o forse no">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
      background: #000;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    h1 {
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      font-size: clamp(1.7rem, 6vw, 4.6rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.035em;
      text-align: center;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stiamo arrivando... o forse no</h1>
  </main>
  <script>
    try {
      for (const key of Object.keys(localStorage)) {
        if (key.startsWith('rostaTravel.')) localStorage.removeItem(key);
      }
    } catch (_) {}

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => registrations.forEach((registration) => registration.unregister()))
          .catch(() => {});
      });
    }
  </script>
</body>
</html>
