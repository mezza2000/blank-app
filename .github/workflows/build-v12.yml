name: Build RostaTravel v12

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-v12.mjs'
      - '.github/workflows/build-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build v12 from stable v9
        run: node scripts/build-v12.mjs
      - name: Commit generated app
        run: |
          if git diff --quiet -- index.html app-v12.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-v12.html
          git commit -m "Generate RostaTravel v12 [skip ci]"
          git push
