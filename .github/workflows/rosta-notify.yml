name: RostaTravel Notifications

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: rosta-travel-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check transport alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ROSTA_STATE: ${{ vars.ROSTA_STATE }}
          ROSTA_TRAIN_ANDATA: ${{ vars.ROSTA_TRAIN_ANDATA }}
          ROSTA_TRAIN_RITORNO: ${{ vars.ROSTA_TRAIN_RITORNO }}
          ROSTA_DELAY_THRESHOLD: ${{ vars.ROSTA_DELAY_THRESHOLD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/notify.mjs
