name: Fix BinarioForse SEO domain

on:
  push:
    paths:
      - '.github/workflows/fix-binarioforse-seo.yml'

permissions:
  contents: write

jobs:
  fix-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old canonical domain
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app-v9.html')
          text = path.read_text(encoding='utf-8')
          old = 'https://rosta-travel.vercel.app'
          new = 'https://binarioforse.com'
          if old not in text:
              print('Old domain not found; nothing to change.')
          else:
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'Replaced {text.count(old)} occurrence(s).')
          PY

      - name: Commit SEO fix
        run: |
          if git diff --quiet -- app-v9.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v9.html
          git commit -m "Fix BinarioForse canonical domain"
          git push
