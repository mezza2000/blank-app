name: RostaTravel Bot Info Temp
on:
  push:
    paths:
      - '.github/workflows/bot-info-temp.yml'
permissions:
  contents: write
jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save bot username temporarily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node - <<'NODE'
          const fs=require('fs');
          fetch('https://api.telegram.org/bot'+process.env.TELEGRAM_BOT_TOKEN+'/getMe')
            .then(r=>r.json())
            .then(d=>{if(!d.ok)throw new Error(d.description||'getMe failed');fs.writeFileSync('bot-username-temp.txt',d.result.username+'\n')})
            .catch(e=>{console.error(e.message);process.exit(1)})
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot-username-temp.txt
          git commit -m 'Save temporary bot username [skip ci]' || exit 0
          git push
