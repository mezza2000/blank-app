name: Add v9 statistics

on:
  push:
    paths:
      - 'scripts/patch-v9-stats.mjs'
      - '.github/workflows/add-v9-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch stable v9
        run: node scripts/patch-v9-stats.mjs
      - name: Commit patch
        run: |
          if git diff --quiet -- app-v9.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v9.html
          git commit -m "Add anonymous usage stats to stable v9 [skip ci]"
          git push
